[project]
name = "citationer"
version = "5.1.1"
description = "One-click bibliometric analysis CLI tool"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "rich-click>=1.8",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
]

[project.scripts]
citationer = "citationer.cli.main:app"
ctr = "citationer.cli.main:app"

[project.optional-dependencies]
text = [
    "jieba>=0.42",
    "gensim>=4.3",
    "scikit-learn>=1.4",
]
network = [
    "networkx>=3.2",
    "python-louvain>=0.16",
    "plotly>=5.18",
]
ai = [
    "openai>=1.12",
]
viz = [
    "wordcloud>=1.9",
    "plotext>=5.3",
]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.0",
    "types-pyyaml",
    "mkdocs>=1.5",
    "mkdocs-material>=9.4",
]

docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.4",
]  # noqa: E501
all = [
    "jieba>=0.42",
    "gensim>=4.3",
    "scikit-learn>=1.4",
    "rapidfuzz>=3.0",
    "networkx>=3.2",
    "python-louvain>=0.16",
    "plotly>=5.18",
    "openai>=1.12",
    "wordcloud>=1.9",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[tool.setuptools.package-data]
citationer = ["data/*.txt"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
exclude = [".citationer*", "citationer_output*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["citationer"]
