name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  release:
    types: [published]
  workflow_dispatch:

# Silence Node.js 20 deprecation warning.  This is an action-side warning
# from older actions/checkout, actions/setup-python, etc. that still target
# node20.  Once the upstream actions migrate to node24, this can be removed.
env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,dev]"

      - name: Lint with ruff
        run: ruff check src/ tests/

      - name: Type check with mypy
        run: mypy src/ --ignore-missing-imports

      - name: Test with pytest
        run: pytest tests/ -v --cov=src/citationer --cov-report=term-missing --cov-fail-under=80

      # NOTE: Coverage gate at 80% (achieved via P4-1 effort).
      # See issue #22 for full breakdown.

  publish:
    needs: test
    if: |
      github.event_name == 'release' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      # Recommended for PyPI trusted publishing (no API token needed).
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build package
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Skip upload if a file with the same hash already exists on
          # PyPI (idempotent retries after a transient pipeline failure).
          # Uses the kebab-case `skip-existing` (the snake_case form was
          # deprecated).  Authentication uses OIDC via the
          # `id-token: write` permission declared on this job — no
          # PYPI_API_TOKEN secret needed once a Trusted Publisher is
          # configured for this repo on PyPI.
          skip-existing: true
