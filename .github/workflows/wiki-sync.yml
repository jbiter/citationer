name: Sync Wiki

on:
  push:
    branches: ["main"]
    paths:
      - "wiki/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-wiki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync wiki files to GitHub Wiki
        env:
          WIKI_REPO: "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git"
        run: |
          git clone "$WIKI_REPO" wiki-repo
          cp wiki/*.md wiki-repo/
          cd wiki-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add *.md
          if git diff --cached --quiet; then
            echo "No changes to wiki."
          else
            git commit -m "wiki: sync from main branch (${{ github.sha }})"
            git push "$WIKI_REPO" master
          fi
