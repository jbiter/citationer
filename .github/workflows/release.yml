name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Silence Node.js 20 deprecation warning emitted by older action versions
# (checkout@v4, setup-python@v5, upload-artifact@v4, softprops/action-gh-release@v2
# all still target node20).  Once upstream actions migrate to node24 this can
# be removed.  See: https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build-binary:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build deps
        run: pip install pyinstaller

      - name: Build (Unix)
        if: matrix.os != 'windows-latest'
        run: pyinstaller packaging/pyinstaller.spec --noconfirm --clean

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        run: pyinstaller packaging/pyinstaller.spec --noconfirm --clean

      - name: Rename artifact (Windows)
        if: matrix.os == 'windows-latest'
        run: mv dist/citationer.exe dist/citationer-windows.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: citationer-${{ matrix.os }}
          path: dist/citationer*

  attach-to-release:
    needs: build-binary
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: List binaries
        run: ls -la dist/

      # Idempotent attach: ensure a GitHub release for this tag exists, then
      # upload each binary that is not already attached.  Re-running on
      # the same tag (e.g. after deleting and re-pushing) is a no-op for
      # the assets that are already present, avoiding the 404 that
      # softprops/action-gh-release@v2 emits when it tries to clean up
      # non-existent attachment records from a previous draft release.
      - name: Attach to release (idempotent)
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.name.replace('refs/tags/', '');
            let release;
            try {
              release = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: tag,
              });
              core.info(`Using existing release #${release.data.id} for ${tag}`);
            } catch (err) {
              if (err.status !== 404) throw err;
              core.info(`No release yet for ${tag}, creating one.`);
              release = await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                name: tag,
                generate_release_notes: true,
              });
            }

            const wanted = [
              ['dist/citationer-ubuntu-latest/citationer', 'citationer'],
              ['dist/citationer-macos-latest/citationer', 'citationer-macos'],
              ['dist/citationer-windows-latest/citationer-windows.exe', 'citationer-windows.exe'],
            ];
            const existing = new Set(release.data.assets.map(a => a.name));
            const fs = require('fs');
            for (const [path, label] of wanted) {
              if (!fs.existsSync(path)) {
                core.info(`skip ${label}: source ${path} not built`);
                continue;
              }
              if (existing.has(label)) {
                core.info(`skip ${label}: already attached to release`);
                continue;
              }
              core.info(`Uploading ${label} from ${path}`);
              const content = fs.readFileSync(path);
              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.data.id,
                name: label,
                data: content,
              });
            }
            core.info('attach-to-release complete.');
