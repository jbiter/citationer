site_name: Citationer
site_description: One-click bibliometric analysis CLI tool
site_url: https://jbiter.github.io/citationer/
repo_url: https://github.com/jbiter/citationer
repo_name: jbiter/citationer
docs_dir: docs

theme:
  name: material
  palette:
    primary: indigo
    accent: indigo

nav:
  - Home: index.md
  - Installation: install.md
  - Quick Start: quickstart.md
  - Commands: commands.md
  - Configuration: config.md
  - Contributing: contributing.md
  - Changelog: changelog.md

markdown_extensions:
  - admonition
  - codehilite
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
  - attr_list
  - md_in_html
